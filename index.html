<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Placement Portal</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .container{
            display:flex;
            gap:30px;
            flex-wrap:wrap;
            justify-content:center;
        }

        .card{
            width:300px;
            padding:40px 20px;
            background:white;
            border-radius:20px;
            text-align:center;
            cursor:pointer;
            transition:0.3s;
            box-shadow:0 5px 20px rgba(0,0,0,0.2);
        }

        .card:hover{
            transform:translateY(-10px);
        }

        .icon{
            font-size:60px;
            margin-bottom:20px;
        }

        h2{
            margin-bottom:10px;
            color:#333;
        }

        p{
            color:#666;
            margin-bottom:20px;
        }

        button{
            padding:12px 25px;
            border:none;
            border-radius:8px;
            background:#667eea;
            color:white;
            font-size:16px;
            cursor:pointer;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="card" onclick="window.location.href='app.html'">
            <div class="icon">🧠</div>
            <h2>Aptitude Test</h2>
            <p>Practice MCQ aptitude questions and improve your skills.</p>
            <button>Start Aptitude</button>
        </div>

        <div class="card" onclick="window.location.href='int.html'">
            <div class="icon">🎤</div>
            <h2>AI Interview</h2>
            <p>Attend AI-powered mock interviews and get feedback.</p>
            <button>Start Interview</button>
        </div>

    </div>

</body>
</html>
