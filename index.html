<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPO⭐</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }
        .star-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #238636;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            transition: background 0.2s ease;
        }
        .star-btn:hover {
            background: #2ea043;
        }
    </style>
</head>
<body>
  <center>
    <h1>⭐⭐⭐⭐⭐</h1>
    <a class="star-btn" href="https://github.com/kabishS/repo" target="_blank" rel="noopener noreferrer">
      ⭐ Star this repo
    </a>
  </center>
</body>
</html>
